<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FocusGrow — Site Restricted</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #090d16;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px;
      width: 480px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 10px 25px -5px rgba(14, 165, 233, 0.4);
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f8fafc;
    }
    .domain {
      color: #38bdf8;
      font-family: monospace;
      font-size: 14px;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 16px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .pass-title {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .pass-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .pass-btn:hover {
      background: #0ea5e9;
      color: #000;
      border-color: #0ea5e9;
      transform: translateY(-2px);
    }
    .btn-close {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-close:hover {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">FG</div>
    <h1>Site Locked During Focus</h1>
    <div class="domain" id="domain-display">facebook.com</div>
    <p>This website is on your FocusGrow restricted list. Stay focused on your goals!</p>

    <div class="pass-title" id="pass-title">Use Emergency Pass for this session?</div>
    <div class="btn-group" id="pass-buttons">
      <button class="pass-btn" data-mins="5">⚡ 5 Mins</button>
      <button class="pass-btn" data-mins="10">⚡ 10 Mins</button>
      <button class="pass-btn" data-mins="15">⚡ 15 Mins</button>
    </div>

    <div id="cooldown-section" style="display: none;">
       <div class="pass-title" style="color: #f43f5e;">Cooldown Active</div>
       <div id="cooldown-timer" style="font-size: 32px; font-weight: 800; color: #f8fafc; margin-bottom: 20px;">00:00</div>
    </div>

    <div>
      <button class="btn-close" id="btn-close-tab">Close This Tab</button>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
